name: smart-credit-cabinet
x-app-env: &app-env
  DATABASE_URL: "postgresql://credit:${POSTGRES_PASSWORD:-credit-demo-local-password}@db:5432/credit?schema=public"
  APP_ORIGIN: "${APP_ORIGIN:-http://localhost:3000}"
  DEMO_MODE: "${DEMO_MODE:-true}"
  COOKIE_SECURE: "${COOKIE_SECURE:-false}"
  UPLOAD_DIR: /data/uploads
  NEXT_TELEMETRY_DISABLED: "1"
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-credit-demo-local-password}"
      POSTGRES_DB: credit
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  init:
    image: "${IMAGE_BASE:-smart-credit-cabinet}-init:${IMAGE_TAG:-local}"
    build: { context: ., target: init }
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    volumes: ["uploads_data:/data/uploads"]
    restart: "no"
  app:
    image: "${IMAGE_BASE:-smart-credit-cabinet}:${IMAGE_TAG:-local}"
    build: { context: ., target: runner }
    environment:
      <<: *app-env
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"]
    depends_on:
      db: { condition: service_healthy }
      init: { condition: service_completed_successfully }
    volumes: ["uploads_data:/data/uploads"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      start_period: 20s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
  uploads_data:
